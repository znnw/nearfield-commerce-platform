server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: local-commerce-service
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: "${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/local_commerce?useSSL=false&serverTimezone=UTC}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.localcommerce.entity # 别名扫描包
logging:
  level:
    com.localcommerce: debug
