<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>近场消费服务</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
  </style>
  <link href="./css/theme.css?v=20261018b" rel="stylesheet">
  <link href="./css/theme-v2.css?v=20261019b" rel="stylesheet">
</head>
<body class="page-home">
<div id="app">
  <div class="search-bar">
    <div class="city-btn">杭州 <i class="el-icon-arrow-down"></i></div>
    <div class="search-input">
      <el-input size="mini" placeholder="请输入商户名、地点">
        <i slot="prefix" class="el-input__icon el-icon-search"></i>
      </el-input>
    </div>
    <div class="header-icon" @click="toPage(4)"><i class="el-icon-user"></i></div>
  </div>
  <main class="home-scroll" @scroll="onScroll">
    <section class="home-hero" v-if="featuredSlides.length"
             @mouseenter="stopCarousel" @mouseleave="startCarousel"
             @touchstart="touchStartFeatured" @touchend="touchEndFeatured">
      <div class="carousel-track" :style="{ transform: 'translateX(-' + (featuredIndex * 100) + '%)' }">
        <article class="home-hero-slide" v-for="b in featuredSlides" :key="b.id" @click="openFeatured(b)">
          <img class="home-hero-img" :src="b.img" :alt="b.title">
          <div class="home-hero-copy">
            <span class="home-hero-kicker">FIELD NOTE / 今日热门</span>
            <h1>{{b.title}}</h1>
            <div class="home-hero-meta">
              <img :src="b.icon || '/imgs/icons/default-icon.png'" alt="">
              <span>{{b.name}}</span>
              <span class="home-hero-like"><i class="el-icon-star-off"></i> {{b.liked}}</span>
            </div>
          </div>
        </article>
      </div>
      <button type="button" class="carousel-control carousel-prev" title="上一条热门笔记"
              aria-label="上一条热门笔记" @click.stop="prevFeatured">
        <i class="el-icon-arrow-left"></i>
      </button>
      <button type="button" class="carousel-control carousel-next" title="下一条热门笔记"
              aria-label="下一条热门笔记" @click.stop="nextFeatured">
        <i class="el-icon-arrow-right"></i>
      </button>
      <div class="carousel-dots" aria-label="热门笔记切换">
        <button type="button" v-for="(b, index) in featuredSlides" :key="b.id"
                class="carousel-dot" :class="{ active: index === featuredIndex }"
                :title="'第 ' + (index + 1) + ' 条热门笔记'"
                :aria-label="'第 ' + (index + 1) + ' 条热门笔记'"
                @click.stop="goFeatured(index)"></button>
      </div>
      <span class="home-hero-index">NO. 0{{ featuredIndex + 1 }}</span>
    </section>
    <section class="explore-strip">
      <div class="explore-heading">
        <span>EXPLORE THE CITY</span>
        <span>{{types.length}} CATEGORIES</span>
      </div>
      <div class="type-list">
        <div class="type-box" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
          <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
          <div class="type-text">{{t.name}}</div>
        </div>
      </div>
    </section>
    <div class="discover-head">
      <div>
        <span class="discover-kicker">CANAL EDITION / VOL. 01</span>
        <h2>运河边的新鲜事</h2>
      </div>
      <span class="discover-meta">杭州 · 今日精选</span>
    </div>
    <div class="blog-list">
      <div class="blog-box" v-for="b in blogs" :key="b.id">
        <div class="blog-img" @click="toBlogDetail(b)"><img :src="b.img" alt=""></div>
        <div class="blog-title">{{b.title}}</div>
        <div class="blog-foot">
          <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
          <div class="blog-user-name">{{b.name}}</div>
          <div class="blog-liked" @click="addLike(b)">
            <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
              <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#e26745' : '#7a8781'"></path>
            </svg>
            {{b.liked}}
          </div>
        </div>
      </div>
      <div class="feed-status" v-if="loadingBlogs">正在加载更多笔记</div>
      <div class="feed-status" v-else-if="noMoreBlogs && blogs.length">已经看到全部笔记</div>
    </div>
  </main>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      loadingBlogs: false,
      noMoreBlogs: false,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
      featuredIndex: 0,
      featuredTimer: null,
      touchStartX: 0,
      suppressFeaturedClick: false,
    },
    computed: {
      featuredSlides() {
        return this.blogs.slice(0, 5)
      }
    },
    mounted() {
      this.startCarousel()
    },
    beforeDestroy() {
      this.stopCarousel()
    },
    created() {
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list?ts=" + Date.now())
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        if (this.loadingBlogs || this.noMoreBlogs) {
          return;
        }
        this.loadingBlogs = true;
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            data.forEach(b => b.img = b.images.split(",")[0]);
            this.blogs = this.blogs.concat(data);
            this.noMoreBlogs = data.length < 10;
          })
          .catch(err => {
            this.$message.error(err)
          })
          .finally(() => {
            this.loadingBlogs = false;
          })
      },
      startCarousel() {
        this.stopCarousel()
        this.featuredTimer = setInterval(() => {
          if (this.featuredSlides.length > 1) {
            this.featuredIndex = (this.featuredIndex + 1) % this.featuredSlides.length
          }
        }, 5000)
      },
      stopCarousel() {
        if (this.featuredTimer) {
          clearInterval(this.featuredTimer)
          this.featuredTimer = null
        }
      },
      goFeatured(index) {
        this.featuredIndex = index
      },
      prevFeatured() {
        const total = this.featuredSlides.length
        if (total > 1) {
          this.featuredIndex = (this.featuredIndex - 1 + total) % total
        }
      },
      nextFeatured() {
        const total = this.featuredSlides.length
        if (total > 1) {
          this.featuredIndex = (this.featuredIndex + 1) % total
        }
      },
      touchStartFeatured(event) {
        this.touchStartX = event.changedTouches[0].clientX
        this.suppressFeaturedClick = false
        this.stopCarousel()
      },
      touchEndFeatured(event) {
        const delta = event.changedTouches[0].clientX - this.touchStartX
        if (Math.abs(delta) > 45) {
          this.suppressFeaturedClick = true
          delta < 0 ? this.nextFeatured() : this.prevFeatured()
        }
        this.startCarousel()
      },
      openFeatured(blog) {
        if (this.suppressFeaturedClick) {
          this.suppressFeaturedClick = false
          return
        }
        this.toBlogDetail(blog)
      },
      addLike(b) {
        axios.put("/blog/like/" +b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked ++;
          })
      },
      onScroll(e) {
        const target = e.target;
        const isBottom = target.scrollTop + target.clientHeight + 2 >= target.scrollHeight;
        if (isBottom && !this.loadingBlogs && !this.noMoreBlogs) {
          this.current++;
          this.queryHotBlogsScroll();
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      }
    }
  })
</script>
</body>
</html>
